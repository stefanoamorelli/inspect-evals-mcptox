name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        # The dataset_download end-to-end test hits a third-party repo at runtime;
        # it is exercised locally rather than on every CI run to keep CI hermetic.
        run: uv run pytest -m "not dataset_download"

      - name: Build
        run: uv build
